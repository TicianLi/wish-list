name: 每日凌晨自动刷新并邮件导出

# ---------------------------------------------------------------
# 问题 #3：每天北京时间 02:00 自动刷新 Steam 愿望单价格/史低，
#          导出 JSON 并发送到指定邮箱。
#
# 时间说明：GitHub Actions 的 cron 使用 UTC。
#   北京时间 02:00  →  UTC 18:00（前一天）
#   所以 cron = '0 18 * * *'
#   ⚠️ 注意：GitHub 的定时任务在高峰期可能延迟几分钟到十几分钟，属正常现象。
#
# 首次使用请先在仓库 Settings → Secrets and variables → Actions 添加：
#   SMTP_HOST    smtp.qq.com
#   SMTP_PORT    465
#   SMTP_USER    你的QQ邮箱@qq.com
#   SMTP_PASS    QQ邮箱「授权码」（不是登录密码！）
#   MAIL_TO      接收邮件的邮箱（可以就是你自己）
#   ITAD_API_KEY （可选）ITAD 史低查询用的 Key
#
# ---------------------------------------------------------------
# 【2026-09-19 改造：分片并行】
#   起因：实测 219 款耗时 11.2 分钟，平均每款 3.07 秒（含 429 退避）。
#         线性外推 1000 款 ≈ 51 分钟，**超过 45 分钟上限会被 GitHub 强杀**。
#         所以"加一千款一万款"还有第二道墙：单 job 时长。
#
#   方案：先算清单规模 → 决定分片数 → matrix 并行跑各分片 → 汇总合并。
#
# 【2026-09-25 修正：PER_SHARD 400 → 40，并新增时间预算】
#   上面那个方案当时把 PER_SHARD 定成 400，是个错误的保守：261 款只算出 1 片，
#   等于**根本没分片**。run #42 就是这么挂的 —— 那台 runner 的 IP 被 Steam
#   持续限流近 30 分钟，自适应限速把间隔推到 60s/款上限，跑满 45 分钟只刷到
#   244/261 就被 GitHub 强杀 → finalize（合并+发信）被 skip →
#   **当天没邮件、数据也没更新**。
#   修正两点：
#     ① PER_SHARD=40：让分片真正起到"分散到多个 runner（各自 IP）+ 压低单 IP
#        请求量"的作用，而不是名义上的分片。
#     ② REFRESH_BUDGET_MS=40 分钟：跑到点就主动收尾并以 exit 0 结束，
#        保证"写盘 + finalize + 发信"一定能执行 —— 宁可发一封部分数据的邮件，
#        也不要静默全丢（见 tools/daily-refresh.mjs 的 CFG.refreshBudgetMs）。
#   规模参考（正常约 3.6 秒/款）：261 款 → 7 片，每片 ~2.3 分钟。
# ---------------------------------------------------------------

on:
  schedule:
    - cron: '0 18 * * *'      # 北京时间次日 02:00
  workflow_dispatch:           # 支持在 Actions 页面手动点一下立即运行
    inputs:
      mail_mode:
        description: '发信模式'
        required: false
        default: 'always'
        type: choice
        options: [always, changes]

# 允许把刷新后的数据写回仓库
permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  # =============================================================
  # 准备阶段：读清单规模，自动决定分片数
  # =============================================================
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.calc.outputs.shards }}
      shard_list: ${{ steps.calc.outputs.shard_list }}
      total: ${{ steps.calc.outputs.total }}
      found: ${{ steps.calc.outputs.found }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 计算分片数
        id: calc
        run: |
          if [ -f data/wishlist.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            TOTAL=$(node -e "const d=require('./data/wishlist.json'); console.log((d.games||[]).length)")
            echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
            # 每片最多 PER_SHARD 款；分片数夹在 [1, MAX_SHARDS]。
            # MAX_SHARDS 默认 256 是 GitHub Actions matrix 的硬上限。
            #
            # PER_SHARD 的取值（2026-09-25 由 400 下调到 40）：
            #   原来 400 太大 —— 261 款只算出 1 片，等于**根本没分片**。
            #   run #42 就是这么挂的：那台 runner 的 IP 被 Steam 持续限流近 30 分钟，
            #   自适应限速把间隔推到 60s/款上限，跑满 45 分钟只刷到 244/261 就被强杀，
            #   finalize（合并+发信）整个被 skip —— 当天没邮件、数据也没更新。
            #   每片 40 款的依据（从两个上限反推，不是拍脑袋）：
            #     ① 请求分散到更多 runner（各自独立 IP），单 IP 压力降一个量级，不易触发限流；
            #     ② 最坏单款耗时 = 自适应限速上限 60s ⇒ 每片最坏 40×60s = 40 分钟，
            #        正好等于 REFRESH_BUDGET_MS，且 < job 的 45 分钟上限 ——
            #        也就是说**连极端限流都在预算内**，不会走到截断。
            PER_SHARD="${PER_SHARD:-40}"
            MAX_SHARDS="${MAX_SHARDS:-256}"
            SHARDS=$(node -e "
              const n=$TOTAL, per=$PER_SHARD, cap=$MAX_SHARDS;
              console.log(Math.min(cap, Math.max(1, Math.ceil(n/per))));
            ")
            LIST=$(node -e "console.log(JSON.stringify(Array.from({length:$SHARDS},(_,i)=>i)))")
            echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
            echo "shard_list=$LIST" >> "$GITHUB_OUTPUT"
            echo "✅ 清单 $TOTAL 款 → 分 $SHARDS 片（每片上限 $PER_SHARD 款，最多 $MAX_SHARDS 片）"
            echo "   分片序号：$LIST"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "shards=0" >> "$GITHUB_OUTPUT"
            echo "shard_list=[0]" >> "$GITHUB_OUTPUT"
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "::warning::data/wishlist.json 不存在，请先在页面点「☁️ 同步到云端」上传数据。本次跳过刷新。"
          fi

  # =============================================================
  # 刷新阶段：matrix 并行，每个 job 只刷自己那片
  # =============================================================
  refresh:
    needs: plan
    if: needs.plan.outputs.found == 'true' && needs.plan.outputs.shards != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # 分片之间互不影响：某一片失败不该拖垮其它片
      fail-fast: false
      # ⚠️ 同时运行的分数上限 —— 必须保持 1（2026-09-25 实测封板）
      #   7 片并行时，7 个 runner 同时对 Steam 发请求，把**总请求速率放大 7 倍**，
      #   Steam 用「HTTP 200 但返回空 JSON」的方式静默限流（不是 429！）。
      #   run #43 实测：7 片并行 → 各片只有 5~10/38 款拿到数据，合计 53/261（20.3%）；
      #   而 run #39/#40/#41（单片、同一份代码）都是「刷新成功 261｜失败 0」。
      #   → Steam 的容忍度按**总速率**算，分片并行不能提速，只会把自己打死。
      #     所以分片只保留「把单个 job 的时长压到有界」这一个作用：串行跑
      #     （max-parallel: 1），总速率 = 单片水平（实测 100%），且每个 job
      #     都远小于 45 分钟上限。真被限流了还有 steamAppDetails 的静默限流自愈兜底。
      max-parallel: 1
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard_list) }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 执行刷新（本分片，不发信）
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          STEAM_CC: cn
          STEAM_LANG: schinese
          SHARD_TOTAL: ${{ needs.plan.outputs.shards }}
          SHARD_INDEX: ${{ matrix.shard }}
          # 时间预算：跑到 40 分钟主动收尾（正常 exit 0），避免被 job 超时强杀
          # 导致 finalize 被 skip、当天颗粒无收。40 分钟 = 每片最坏时长
          # （PER_SHARD 40 款 × 退避上限 60s），见 tools/daily-refresh.mjs 的
          # CFG.refreshBudgetMs。可在仓库 Variables 覆盖。
          REFRESH_BUDGET_MS: ${{ vars.REFRESH_BUDGET_MS || '2400000' }}
        run: node tools/daily-refresh.mjs

      - name: 上传本分片结果
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: data/_shards/
          retention-days: 2
          if-no-files-found: error

  # =============================================================
  # 汇总阶段：合并所有分片 → 补齐全局数据（日历/标签/翻译）→ 发信 → 提交
  # =============================================================
  finalize:
    needs: [plan, refresh]
    if: needs.plan.outputs.found == 'true' && needs.plan.outputs.shards != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 下载所有分片结果
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
          path: data/_shards/

      - name: 列出分片文件（便于排错）
        run: ls -la data/_shards/ || true

      - name: 合并分片（无损，校验全覆盖）
        env:
          SHARD_TOTAL: ${{ needs.plan.outputs.shards }}
        run: node tools/merge-shards.mjs

      - name: 补齐全局数据并发送邮件
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          STEAM_CC: cn
          STEAM_LANG: schinese
          MAIL_MODE: ${{ github.event.inputs.mail_mode || 'always' }}
          # 分片已刷过价格/评分，汇总阶段跳过重复刷新，只做全局补充
          SKIP_PRICE_REFRESH: 'true'
        run: node tools/daily-refresh.mjs

      - name: 把刷新后的数据提交回仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "数据无变化，无需提交。"
          else
            git commit -m "chore: 每日自动刷新 $(date -u +'%Y-%m-%d %H:%M') UTC"
            # 历史问题 #2：如果这次运行期间远端 main 被别的提交推进了（例如从页面/脚本改了仓库文件），
            # 直接 git push 会被拒 —— 之前 run #5 就是这么失败（exit 1）的。
            # 这里改成「先 rebase 再推」，最多重试 3 次。
            ok=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin main || true
              if git push origin HEAD:main; then ok=1; break; fi
              echo "第 $i 次推送失败，5 秒后重试…"
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "::error::数据已在本地提交，但推送远端 main 失败（已重试 3 次）。请检查仓库 Settings → Actions → Workflow permissions 是否为 Read and write。"
              exit 1
            fi
            echo "✅ 已提交刷新后的数据"
          fi

      - name: 归档 JSON 快照
        uses: actions/upload-artifact@v4
        with:
          name: wishlist-json-${{ github.run_number }}
          path: data/*.json
          retention-days: 30
          if-no-files-found: warn
