<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云端同步 · 连通性自检</title>
<style>
  :root{--bg:#0e1622;--bg2:#16202e;--bg3:#1b2838;--text:#dfe8f1;--muted:#8fa3b5;
        --border:#24354a;--accent:#66c0f4;--green:#3ba55d;--red:#e05a5a;--yellow:#e0c34a;}
  *{box-sizing:border-box;}
  body{margin:0;padding:24px;background:var(--bg);color:var(--text);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;}
  .wrap{max-width:760px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 6px;color:#eaf4ff;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;
        padding:16px 18px;margin-bottom:14px;}
  .row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;
       border-bottom:1px solid rgba(36,53,74,.6);}
  .row:last-child{border-bottom:0;}
  .tick{flex:0 0 22px;font-size:15px;line-height:1.5;}
  .lbl{flex:0 0 190px;color:var(--muted);font-size:13px;}
  .val{flex:1;min-width:0;word-break:break-all;font-size:13px;}
  .ok{color:#6fd88f;} .bad{color:#ff8a8a;} .warn{color:var(--yellow);}
  button{background:linear-gradient(180deg,#2b7fbd,#1d5c8d);border:1px solid rgba(140,210,255,.4);
         color:#f0f9ff;border-radius:9px;padding:10px 18px;font-size:14px;cursor:pointer;
         font-family:inherit;font-weight:600;}
  button:hover{filter:brightness(1.12);} button:disabled{opacity:.55;cursor:not-allowed;}
  input{width:100%;background:rgba(9,17,26,.85);border:1px solid rgba(102,192,244,.22);
        color:var(--text);border-radius:9px;padding:10px 13px;font-size:13px;outline:none;
        font-family:Consolas,monospace;letter-spacing:1px;}
  input:focus{border-color:rgba(102,192,244,.75);}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;}
  pre{background:#0a121c;border:1px solid var(--border);border-radius:8px;padding:11px 13px;
      font-size:12px;line-height:1.55;overflow:auto;max-height:360px;margin:10px 0 0;
      white-space:pre-wrap;word-break:break-all;color:#c4d6e6;}
  .verdict{margin-top:14px;padding:13px 16px;border-radius:10px;font-size:13.5px;line-height:1.7;}
  .verdict.good{background:rgba(59,165,93,.13);border:1px solid rgba(59,165,93,.4);}
  .verdict.bad{background:rgba(224,90,90,.13);border:1px solid rgba(224,90,90,.45);}
  .verdict.mid{background:rgba(224,195,74,.13);border:1px solid rgba(224,195,74,.4);}
  .big{font-size:15px;font-weight:700;margin-bottom:6px;}
  a{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔍 云端同步 · 连通性自检</h1>
  <div class="sub">把这个文件放在和 index.html 同一个目录，用<strong>同样的方式</strong>打开它，
    就能判断到底是「网络」还是「权限」的问题。</div>

  <div class="card">
    <div class="field">
      <label>GitHub Token（可选；填了才能测权限，不填只测网络）</label>
      <input type="password" id="tok" placeholder="github_pat_… 或 ghp_…" autocomplete="off">
    </div>
    <div class="field">
      <label>仓库（owner/repo）</label>
      <input type="text" id="repo" value="TicianLi/wishlist">
    </div>
    <button id="go">开始检测</button>
  </div>

  <div class="card">
    <div class="row"><span class="tick" id="t-page">·</span><span class="lbl">页面地址 / 协议</span><span class="val" id="v-page">—</span></div>
    <div class="row"><span class="tick" id="t-online">·</span><span class="lbl">浏览器在线状态</span><span class="val" id="v-online">—</span></div>
    <div class="row"><span class="tick" id="t-cors">·</span><span class="lbl">预检（OPTIONS 会被拦截吗）</span><span class="val" id="v-cors">—</span></div>
    <div class="row"><span class="tick" id="t-ping">·</span><span class="lbl">可达性（GitHub 状态页）</span><span class="val" id="v-ping">—</span></div>
    <div class="row"><span class="tick" id="t-rate">·</span><span class="lbl">api.github.com 匿名可达</span><span class="val" id="v-rate">—</span></div>
    <div class="row"><span class="tick" id="t-api">·</span><span class="lbl">api.github.com 带 Token 读取</span><span class="val" id="v-api">—</span></div>
  </div>

  <div class="verdict" id="verdict" style="display:none;"></div>
  <pre id="log" style="display:none;"></pre>
</div>

<script>
const $ = s => document.querySelector(s);
const set = (tick, val, state, text) => {
  $(tick).textContent = state === 'ok' ? '✅' : state === 'bad' ? '❌' : state === 'warn' ? '⚠️' : '·';
  $(tick).className = 'tick ' + (state === 'ok' ? 'ok' : state === 'bad' ? 'bad' : state === 'warn' ? 'warn' : '');
  $(val).textContent = text;
  $(val).className = 'val ' + (state === 'ok' ? 'ok' : state === 'bad' ? 'bad' : state === 'warn' ? 'warn' : '');
};
const logs = [];
const L = m => { logs.push(m); $('#log').style.display = 'block'; $('#log').textContent = logs.join('\n'); };

async function probe(url, opts) {
  const t0 = performance.now();
  try {
    const r = await fetch(url, opts);
    return { ok: true, status: r.status, ms: Math.round(performance.now() - t0), resp: r };
  } catch (e) {
    return { ok: false, err: e, name: e.name, message: e.message, ms: Math.round(performance.now() - t0) };
  }
}

$('#go').addEventListener('click', async () => {
  $('#go').disabled = true;
  logs.length = 0; $('#log').textContent = '';
  const tok = $('#tok').value.trim();
  const repo = $('#repo').value.trim() || 'TicianLi/wishlist';
  let verdict = { level: 'mid', title: '', body: [] };
  try {
    // 1. 页面协议
    const proto = location.protocol;
    const isFile = proto === 'file:';
    set('#t-page', '#v-page', isFile ? 'bad' : 'ok',
        proto + (isFile ? '  ← 直接打开本地文件，浏览器会拦跨域请求' : ''));
    L('location: ' + location.href);

    // 2. 在线状态
    const on = navigator.onLine;
    set('#t-online', '#v-online', on ? 'ok' : 'bad', on ? '在线' : '浏览器报告离线');
    L('navigator.onLine = ' + on);
    L('userAgent = ' + navigator.userAgent);

    // 3. 预检：一个必定 404 但能证明"请求出得去"的地址
    const pre = await probe('https://api.github.com/rate_limit');
    set('#t-cors', '#v-cors', pre.ok ? 'ok' : 'bad',
        pre.ok ? '请求成功发出（' + pre.ms + 'ms）' : pre.name + ': ' + pre.message + '（' + pre.ms + 'ms）');
    L('--- GET https://api.github.com/rate_limit ---');
    L(pre.ok ? 'HTTP ' + pre.status + ' in ' + pre.ms + 'ms' : pre.name + ': ' + pre.message);

    // 4. 状态页（不同域名，用于区分"整个网络不通"还是"只拦了 api.github.com"）
    const st = await probe('https://www.githubstatus.com/api/v2/status.json');
    set('#t-ping', '#v-ping', st.ok ? 'ok' : 'warn',
        st.ok ? 'githubstatus.com 可达' : 'githubstatus.com 也不可达 → 更像是整体网络/代理问题');
    L('--- GET githubstatus.com ---');
    L(st.ok ? 'HTTP ' + st.status : st.name + ': ' + st.message);

    // 5. 匿名读 API
    if (pre.ok) {
      let j = null;
      try { j = await pre.resp.clone().json(); } catch (e) {}
      const rem = j && j.rate ? (j.rate.remaining + '/' + j.rate.limit) : '未知';
      set('#t-rate', '#v-rate', 'ok', 'api.github.com 匿名可达，剩余配额 ' + rem);
      L('rate_limit: ' + JSON.stringify(j && j.rate));
    } else {
      set('#t-rate', '#v-rate', 'bad', 'api.github.com 无法访问');
    }

    // 6. 带 Token 读取
    if (!tok) {
      set('#t-api', '#v-api', 'warn', '未填 Token，跳过权限检测');
      L('skip: no token');
    } else {
      const a = await probe('https://api.github.com/repos/' + repo, {
        headers: { 'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json' }
      });
      if (a.ok && a.resp.ok) {
        const info = await a.resp.json();
        const canPush = info.permissions ? info.permissions.push : null;
        set('#t-api', '#v-api', canPush === false ? 'warn' : 'ok',
            '读到 ' + info.full_name + (info.private ? '（私有）' : '（公开）') +
            ' · 默认分支 ' + info.default_branch +
            ' · 写权限 ' + (canPush === null ? '未知（细粒度 Token 不返回）' : canPush ? '有' : '无'));
        L('repo: ' + JSON.stringify({ full_name: info.full_name, default_branch: info.default_branch, permissions: info.permissions }));
      } else if (a.ok) {
        let body = '';
        try { body = JSON.stringify(await a.resp.json()); } catch (e) {}
        set('#t-api', '#v-api', 'bad', 'HTTP ' + a.status + '  ' + body.slice(0, 160));
        L('repo error HTTP ' + a.status + ': ' + body);
      } else {
        set('#t-api', '#v-api', 'bad', a.name + ': ' + a.message);
        L('repo fetch threw: ' + a.name + ' ' + a.message);
      }
    }

    // ---- 结论 ----
    if (!pre.ok) {
      verdict.level = 'bad';
      verdict.title = '结论：请求根本发不出去 —— 这是网络/浏览器层面的拦截，跟 Token 无关。';
      verdict.body = [
        '你刚才那个 "Failed to fetch" 就是这个原因。',
        '排查顺序：',
        '1. 看上面「页面地址 / 协议」是不是 file:// —— 是的话请改用 https 网址访问；',
        '2. 关掉广告拦截 / 隐私防护类浏览器扩展（uBlock、Privacy Badger、AdGuard 等）再试；',
        '3. 换一个网络（手机热点）试试，排除公司/校园网限制；',
        '4. 如果开了 VPN / 代理软件，关掉或换个节点再试。'
      ];
    } else if (tok && $('#v-api') && /HTTP (401|403|404)/.test($('#v-api').textContent)) {
      verdict.level = 'bad';
      verdict.title = '结论：网络是通的，问题出在 Token 或仓库配置上。';
      verdict.body = [
        '请看上面最后一行「带 Token 读取」的具体状态码：',
        '· 401 → Token 无效或过期，重新生成；',
        '· 403 → Token 没勾选这个仓库，或 Contents 权限不是 Read and write；',
        '· 404 → 仓库名写错，或 Token 看不到这个仓库。'
      ];
    } else if (tok) {
      verdict.level = 'good';
      verdict.title = '结论：网络和 Token 都没问题。';
      verdict.body = [
        '如果页面里同步仍然失败，请按 F12 打开开发者工具 → Console，',
        '把红色报错截图给我，上面会有更具体的原因。'
      ];
    } else {
      verdict.level = 'mid';
      verdict.title = '结论：网络可达。';
      verdict.body = ['填入 Token 再点一次，可以进一步确认权限是否正常。'];
    }
  } catch (e) {
    verdict.level = 'bad';
    verdict.title = '检测过程本身出错：' + e.message;
  }
  const v = $('#verdict');
  v.className = 'verdict ' + (verdict.level === 'good' ? 'good' : verdict.level === 'bad' ? 'bad' : 'mid');
  v.style.display = 'block';
  v.innerHTML = '<div class="big">' + verdict.title + '</div>' +
    verdict.body.map(b => '<div>' + b + '</div>').join('');
  $('#go').disabled = false;
});
</script>
</body>
</html>
